<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temporarily unavailable</title>
<style>
  :root {
    --bg: #EEF1EC;
    --ink: #2B2E2C;
    --moss: #6E8F74;
    --line: rgba(43, 46, 44, 0.12);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 3rem;
  }

  main {
    max-width: 30rem;
    text-align: center;
  }

  .mark {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--moss);
    margin: 0 auto 2.5rem;
  }

  h1 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 2.1rem;
    font-weight: 400;
    line-height: 1.4;
    margin: 0 0 1.5rem;
    letter-spacing: 0.01em;
  }

  p {
    font-size: 1.1rem;
    line-height: 1.7;
    color: rgba(43, 46, 44, 0.65);
    margin: 0 0 1rem;
  }

  p:last-child {
    margin-bottom: 0;
  }

  .muted {
    color: rgba(43, 46, 44, 0.4);
  }

  .divider {
    width: 100%;
    height: 1px;
    background: var(--line);
    margin: 2.25rem 0;
  }

  @media (prefers-reduced-motion: no-preference) {
    main { animation: rise 2.2s cubic-bezier(0.16, 1, 0.3, 1); }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(32px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <main>
    <div class="mark"></div>
    <h1>This site is temporarily unavailable.</h1>
    <p class="muted">It's being looked after.</p>
    <div class="divider"></div>
    <p>Have a nice day :)</p>
  </main>
</body>
</html>
